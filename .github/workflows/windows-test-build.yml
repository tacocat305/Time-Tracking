name: Windows tester installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build and test Windows installers
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Run Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

      - name: Build NSIS and MSI installers
        run: pnpm tauri build --bundles nsis,msi

      - name: Verify installers and launch the app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDirectory = Join-Path $PWD "src-tauri\target\release"
          $application = Join-Path $releaseDirectory "legal-time-tracker.exe"
          $installers = @(
            Get-ChildItem -Path (Join-Path $releaseDirectory "bundle") -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".msi") }
          )

          if (-not (Test-Path -LiteralPath $application)) {
            throw "The Windows application executable was not produced."
          }
          if ($installers.Count -lt 2) {
            throw "Expected both NSIS and MSI installers, but found $($installers.Count)."
          }

          $process = Start-Process -FilePath $application -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "The packaged Windows application exited during launch testing with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

          Write-Host "Verified both installers and completed the Windows launch smoke test."

      - name: Upload Windows tester installers
        uses: actions/upload-artifact@v4
        with:
          name: legal-time-tracker-windows-testers
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
